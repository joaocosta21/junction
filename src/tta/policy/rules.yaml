# Policy rules of the Trusted Trade Agents gateway: what the buyer's agent may decide alone, what needs
# a human, and what can never be ordered (AIMO/SPEC.md section 7).
#
# The structure is Gabriela's (AIMO/policy/policy.yaml, branch bio2): declared facts, declarative rules,
# the most severe verdict wins, a missing fact never passes, and a hash of the policy in force.
#
# This file is DATA. The engine (tta.policy.engine) only reads it. One rule is written in code and not here:
# F-10, "every order needs human approval", in tta.policy.human_approval. It fires only when no other rule
# asks for a person, which a `when` of this file cannot say. It is described where the profile rules start.
#   * Every rule is evaluated deterministically. No model decides a verdict, a price or a quantity.
#   * Fixed rules (fixed: true) hold for every buyer. Their `when` may not read a `profile.*` fact, so no
#     profile setting can switch one off or weaken it, and a profile file that names one is rejected at load.
#     The verdict and the approver role of each fixed rule are also written in code (tta.policy.validation):
#     a copy of this file that changes one of them, or drops a fixed rule, is rejected at load.
#   * Profile rules compare an option with the settings of one buyer profile (profiles/*.yaml).
#     The limit values live there and are illustrative. Nothing in this file is a Valio Aimo limit.
#   * A condition whose fact is missing is unknown, not false. A rule left unknown fires F-03.
#   * The policy hash is the SHA-256 of the canonical form of this file, of F-10 and of the profile in force.
#
# Dropped from Friday's file, as AIMO/PLAN.md section 5 asks: the contradicted-closing-time setting and its
# trust finding (a passed cut-off now excludes the product, SPEC section 4), the three placeholder values
# and their quantity threshold (a quantity that is not confirmed always goes to a human, F-01), and the
# rule that blocked the GS1 code for "no declarable allergens". Not carried over because SPEC section 7
# does not list them and the offer already excludes those products: not deliverable, pack size estimated
# or unknown, quantity off the lot step.

policy_id: tta-default
version: 1.0.0

verdicts:
  # Least to most severe. The most severe verdict of the rules that fire wins.
  - AUTO        # no rule of this file fired; the agent orders alone only if the buyer switched that on (F-10)
  - APPROVAL    # a human with the named role decides
  - BLOCK       # cannot be ordered, even with approval

defaults:
  verdict_when_no_rule_fires: AUTO
  on_missing_fact: APPROVAL                     # missing is not good: never order alone on data we do not have
  missing_fact_approver_role: purchasing_manager  # when the missing fact names no role of its own

roles:
  purchasing_manager:
    name: "the purchasing manager"
    decides: "Spend per order, partial fills, substitutes, variable weight and quantities that are not confirmed"
  dietitian:
    name: "the dietitian"
    decides: "Products that do not rule out an allergen the buyer excludes, and substitutes that lack a dietary claim of the product they replace"
  finance:
    name: "finance"
    decides: "Spend per day and totals that leave deposits out"

# The fixed rules as five plain statements: what a customer reads in place of the list of rule ids. Every fixed
# rule and every access rule names exactly one of these keys as its `group`; a profile rule names none. The keys
# are pinned in code (tta.policy.validation.RULE_GROUPS) and tta.policy.rule_groups() gives each statement with
# the ids of its rules. F-05 (a substitute that adds an allergen) is in the third group although it is stricter
# than the statement: such a substitute is never ordered, it does not go to a person.
groups:
  excluded_allergen_never_ordered: "An allergen you exclude is never ordered."
  unconfirmed_goes_to_a_person: "Anything Valio Aimo's data does not confirm goes to a person."
  substitute_not_like_for_like: "A substitute that is not a like-for-like replacement goes to a person."
  out_of_date_offer: "An offer that is out of date cannot be ordered."
  agent_never_approves: "The agent never approves."

# What each value of the profile setting `substitution_without_approval` lets the agent accept alone.
# A substitute is LISTED_BY_SUPPLIER when Valio Aimo lists it for the product, else SAME_CATEGORY when it
# shares the 5-digit category, else OUTSIDE. The scopes widen: SAME_CATEGORY includes the listed ones.
substitution_scopes:
  NONE: []
  LISTED_BY_SUPPLIER: [LISTED_BY_SUPPLIER]
  SAME_CATEGORY: [LISTED_BY_SUPPLIER, SAME_CATEGORY]

# ---------------------------------------------------------------------------------------------------------
# Facts: every value a rule or a sentence may read. The loader checks that rules use declared facts only
# and that the engine can read every fact declared here (tta.policy.facts).
#   source: profile = the buyer profile file · option = the offer option being judged ·
#           context = the order context (clock, today's spend, the fresh check at order time) ·
#           engine  = worked out by the engine from the others
#   type:   money prints as 1,980.77 · limit as 750 · ratio as 74.9% · number as 1,000
#   missing_role: who decides when this fact is missing (F-03); otherwise defaults.missing_fact_approver_role
# ---------------------------------------------------------------------------------------------------------
facts:
  # --- the buyer profile ---
  profile.profile_id:                    {type: string, source: profile, label: "the profile"}
  profile.display_name:                  {type: string, source: profile, label: "the buyer's name", note: "what a sentence calls the buyer, never the profile id; text a visitor may have typed, read as data like line.name"}
  profile.auto_order_enabled:            {type: bool,   source: profile, label: "whether the agent may order alone"}
  profile.max_order_net_eur:             {type: limit,  source: profile, label: "the spend limit per order"}
  profile.max_daily_net_eur:             {type: limit,  source: profile, label: "the spend limit per day"}
  profile.min_fill_ratio:                {type: ratio,  source: profile, label: "the minimum share of the quantity"}
  profile.excluded_allergens:            {type: list,   source: profile, label: "the excluded allergens", note: "GS1 codes"}
  profile.allergen_strictness:           {type: enum,   source: profile, label: "the allergen rule", values: [STRICT, DECLARED_ONLY], note: "the rule of every excluded allergen that allergen_strictness_by_code does not name"}
  profile.strict_allergens:              {type: list,   source: profile, label: "the allergens under the STRICT rule", note: "GS1 codes; each excluded allergen's own rule, else the profile's"}
  profile.declared_only_allergens:       {type: list,   source: profile, label: "the allergens under the DECLARED_ONLY rule", note: "GS1 codes; each excluded allergen's own rule, else the profile's"}
  profile.excluded_allergens_said:       {type: string, source: engine,  label: "the excluded allergens, in words", note: "the labels of the catalog's allergen table (tta.allergens.codes): 'tree nuts, peanuts and sesame seeds'; 'no allergen' when none is excluded. A sentence names an allergen in words; the codes stay in the facts next to it"}
  profile.strict_allergens_said:         {type: string, source: engine,  label: "the allergens that must be confirmed absent, in words"}
  profile.declared_only_allergens_said:  {type: string, source: engine,  label: "the allergens kept out as an ingredient, in words"}
  profile.names_dietitian:               {type: bool,   source: engine,  label: "whether somebody holds the dietitian's role", note: "true when the profile's approver_roles names at least one dietitian; read by approver_role_when, never by a `when`"}
  profile.substitution_without_approval: {type: enum,   source: profile, label: "the substitution setting", values: [NONE, LISTED_BY_SUPPLIER, SAME_CATEGORY]}
  profile.substitution_scopes_allowed:   {type: list,   source: engine,  label: "the substitutes accepted without a human", note: "from substitution_scopes above"}
  profile.variable_weight:               {type: enum,   source: profile, label: "the variable-weight setting", values: [APPROVAL, AUTO_WITH_CEILING]}
  profile.deposits:                      {type: enum,   source: profile, label: "the deposit setting", values: [APPROVAL, NOTE]}
  profile.formula_matters:               {type: bool,   source: profile, label: "whether the formula matters on every line", note: "true for a buyer whose products are ingredients (a bakery); read by line.formula_matters and by the texts of F-11"}
  profile.max_preference_premium_ratio:  {type: ratio,  source: profile, label: "the premium a preference may add", note: "share of the cheapest confirmed option's net total (P-09); at most 25%, the share above which the offer ranks the cheapest option first; missing when the profile sets none"}
  profile.limits_preference_premium:     {type: bool,   source: engine,  label: "whether the profile limits what a preference may cost", note: "false when max_preference_premium_ratio is not set: P-09 then never fires and no fact is missing"}
  profile.standing_order_drift_ratio:    {type: ratio,  source: profile, label: "the drift tolerance for standing orders", note: "how far a renewal's quantity or unit price on a line may differ from the median of its history (P-08); missing when the profile sets none"}
  # --- the option ---
  option.net_eur:                 {type: money,    source: option, label: "the total before tax", note: "totals.net"}
  option.fill_ratio:              {type: ratio,    source: option, label: "the share of the quantity covered", note: "the lowest fill ratio over the request's lines"}
  option.least_covered:           {type: string,   source: engine, label: "the least covered request line", note: "'the requested quantity' for a request of one line; else the quantity of the request line with the lowest fill ratio, the first one on a tie (task FIX-12b)"}
  option.coverage_by_line:        {type: string,   source: engine, label: "what each request line gets", note: "covered of requested for each request line, the least covered first; with several lines each is named by its product type, name terms or products, read as data like line.name, and by its number; missing when the option carries no coverage"}
  option.valid_until:             {type: datetime, source: option, label: "the time the option is valid until"}
  option.expired:                 {type: bool,     source: engine, label: "the option's expiry", note: "valid_until at or before the clock, as a cut-off equal to the clock has passed; missing when the option carries no valid_until"}
  option.needed_by_check:         {type: enum,     source: option, label: "the needed-by check", values: [NOT_ASKED, MET, UNVERIFIED, NOT_MET], note: "the least favourable result of the option's constraint checks of kind NEEDED_BY; NOT_ASKED when it carries none, because the request gave no date"}
  option.needed_by:               {type: string,   source: option, label: "the needed-by date", note: "the subject of the needed-by check with the least favourable result"}
  option.needed_by_finding:       {type: string,   source: engine, label: "what the needed-by check found", note: "in words; missing when the date is met or the request gave none"}
  option.total_is_ceiling:        {type: bool,     source: option, label: "whether the total is marked as an estimate by weight", note: "totals.is_ceiling, which keeps its name in the contract; the total of a product sold by weight is an estimate, because Valio Aimo invoices the weight delivered"}
  option.total_excludes_deposits: {type: bool,     source: option, label: "whether the total says it leaves deposits out", note: "totals.excludes_deposits"}
  option.net_above_cheapest:      {type: money,    source: option, label: "what the option costs above the cheapest confirmed option", note: "OfferOption.net_above_cheapest, set on the option ranked by the buyer's preference when a cheaper confirmed option is offered next to it; 0 when the offer sets none"}
  option.preference_premium_ratio: {type: ratio,   source: engine, label: "the premium of the preference", note: "option.net_above_cheapest as a share of the cheapest confirmed option's net total (option.net_eur minus option.net_above_cheapest); 0 when the option costs nothing more; missing when that total is not above 0"}
  # --- the order context ---
  context.at_order_time:          {type: bool,  source: context, label: "whether an order is being placed"}
  context.day_committed_net_eur:  {type: money, source: context, label: "today's committed spend", missing_role: finance, note: "ORDERED and PENDING_APPROVAL orders of the profile today, this order excluded"}
  context.day_waiting_net_eur:    {type: money, source: context, label: "the part of today's committed spend that waits for a person", note: "PENDING_APPROVAL orders of the profile today, this order excluded; read by no condition, so its absence is never a missing fact"}
  order.day_net_eur:              {type: money, source: engine,  label: "today's spend with this order", missing_role: finance, note: "context.day_committed_net_eur plus option.net_eur"}
  order.day_net_said:             {type: string, source: engine, label: "today's spend with this order, in its parts", note: "order.day_net_eur as '€3,772.17 before tax', followed by '(€0.00 ordered, €2,688.78 waiting for a person, and this order's €1,083.39)' when context.day_waiting_net_eur is known"}
  order.stale_reason:             {type: string, source: engine, label: "why the option can no longer be ordered"}
  revalidation.ok:                {type: bool,  source: context, label: "the fresh price and availability check", note: "true only when nothing changed and nothing expired"}
  revalidation.expired:           {type: bool,  source: context, label: "whether the fresh check found an expiry"}
  revalidation.changes:           {type: list,  source: context, label: "what the fresh check found changed"}
  # --- a renewal of a standing order (task STAND-1; tta.policy.drift) ---
  standing.is_renewal:            {type: bool,   source: context, label: "whether the request renews a standing order", note: "false when the request names no standing order: that is never a missing fact"}
  standing.history_judged:        {type: bool,   source: engine,  label: "whether the standing order's history is long enough to judge", note: "true when at least one line has 3 past renewals or more (MIN_RENEWALS_TO_JUDGE); false for a request that renews nothing"}
  standing.largest_drift:         {type: ratio,  source: engine,  label: "the largest drift from the history", note: "|this renewal - median| / median over the last 6 renewals of each line (DRIFT_WINDOW), for each request line's quantity and each product's unit price; 0 when nothing was compared"}
  standing.drift_found:           {type: string, source: engine,  label: "the drift found", note: "every comparison beyond the profile's tolerance, with this renewal's value, the median and the number of renewals"}
  standing.standing_order_id:     {type: string, source: context, label: "the standing order renewed"}
  standing.renewals_compared:     {type: number, source: engine,  label: "the number of past renewals compared"}
  # --- one line of the option ---
  line.product_id:                {type: string, source: option, label: "the product id"}
  line.name:                      {type: string, source: option, label: "the product name", note: "text from the product file, read as data: double quotation marks become an apostrophe, control and format characters a space, at most 120 characters"}
  line.quantity:                  {type: number, source: option, label: "the quantity in sales units"}
  line.availability_state:        {type: enum,   source: option, label: "the availability state", values: [BLOCKED, NOT_DELIVERABLE, OUT_OF_STOCK, CUTOFF_PASSED, QUANTITY_NOT_CONFIRMED, CONFIRMED]}
  line.quantity_confirmed:        {type: bool,   source: engine, label: "the quantity confirmation", note: "state CONFIRMED and a quantity claim that says CONFIRMED; false for any other state; missing when a line in state CONFIRMED carries no quantity claim"}
  line.price_claim:               {type: enum,   source: option, label: "the price claim", values: [CONFIRMED, UNKNOWN, RULED_OUT], note: "whether Valio Aimo's data confirms the price (SPEC section 4); the least favourable statement when the line carries several; missing when it carries none"}
  line.delivery_date_claim:       {type: enum,   source: option, label: "the delivery-date claim", values: [CONFIRMED, UNKNOWN, RULED_OUT], note: "whether Valio Aimo's data confirms the delivery date (SPEC section 4); UNKNOWN when the request gave no date; missing when the line carries none"}
  line.unconfirmed_reason:        {type: string, source: engine, label: "what Valio Aimo's data does not confirm for the line", note: "the price, the delivery date, or both; a delivery date that is UNKNOWN is a reason only on an option that carries a needed-by check"}
  line.allergen_outcomes:         {type: list,   source: option, label: "the allergen check", missing_role: dietitian, note: "every outcome the check reports (PASS, REJECT, TO_HUMAN), its own and each finding's; missing when the profile excludes an allergen the check does not cover, or the check ran under a weaker rule than the profile's"}
  line.allergens_declared:        {type: list,   source: option, label: "the excluded allergens the product declares"}
  line.allergens_to_human:        {type: list,   source: option, label: "the excluded allergens the product does not rule out"}
  line.allergens_declared_said:   {type: string, source: engine, label: "what the product declares of the excluded allergens, in words", note: "'contains peanuts'; a member of a family as 'wheat (counted under cereals containing gluten)'"}
  line.allergens_to_human_said:   {type: string, source: engine, label: "what the product leaves open about the excluded allergens, in words", note: "'may contain tree nuts and says nothing about sesame seeds'"}
  line.is_substitute:             {type: bool,   source: option, label: "whether the line replaces a product the buyer named"}
  line.substitute_original:       {type: string, source: option, label: "the product it replaces", note: "its name, read as data like line.name, and its id"}
  line.substitute_scope:          {type: enum,   source: engine, label: "how close the substitute is", values: [LISTED_BY_SUPPLIER, SAME_CATEGORY, OUTSIDE]}
  line.substitute_adds_allergen:  {type: bool,   source: option, label: "whether the substitute adds an allergen", note: "true when the substitution rule of SPEC section 6 fails: an allergen the original does not declare, or one raised from may contain to contains"}
  line.substitute_added_allergens: {type: list,  source: option, label: "the allergens the substitute adds", note: "added and raised allergens alike, each with the level the substitute declares; the offer does not tell the two apart"}
  line.substitute_added_allergens_said: {type: string, source: engine, label: "what the substitute states about allergens and the product asked for does not, in words", note: "'declares oats and cereals containing gluten', 'may contain tree nuts'"}
  line.substitute_claims_lost_said: {type: string, source: engine, label: "the dietary claims the substitute lacks, in words", note: "'lactose-free'; the offer lists dietary claims only (tta.offers.substitutes.DIETARY_CLAIMS), any other code is said in lower case"}
  line.substitute_claims_lost:    {type: list,   source: option, label: "the nutritional claims the substitute lacks", note: "claims of the original that the substitute does not carry, as the offer lists them (SubstituteInfo.claims_lost); codes of the product file such as FREE_FROM_LACTOSE, read as data like line.name"}
  line.variable_weight:           {type: bool,   source: option, label: "the variable-weight statement", note: "absent on 3,068 of the 17,546 catalog products (AIMO/FINDINGS.md section 4)"}
  line.has_deposits:              {type: bool,   source: option, label: "whether the product carries a deposit"}
  line.stands_in_for:             {type: string, source: engine, label: "the recipe ingredient the line stands in for", note: "task MENU-1: the line's own product type, the recipe's product type it replaces (RequestLine.stands_in_for) and the ingredient's role in the dish, each read as data like line.name; empty when the line stands in for nothing, which is never a missing fact"}
  # --- the formula of a substitute (rule F-11; tta.policy.formula_facts) ---
  line.formula_matters:           {type: bool,   source: engine, label: "whether the formula matters for the line", note: "true when the request line says so or when the buyer profile sets formula_matters; a request or a profile can add the check and neither can remove it. The request line's word is OfferLine.keep_formula: absent or false reads as not said"}
  line.formula_matters_reason:    {type: string, source: engine, label: "who says the formula matters", note: "the request line, else the buyer profile, named by its display name read as data like line.name"}
  line.substitute_keeps_formula:  {type: bool,   source: option, label: "whether the substitute keeps the formula", note: "SubstituteInfo.formula.keeps_formula: the offer's measure (six nutrients within 15% or 1 g, salt within 0.25 g, the same fat source; the tolerances are ours) says SAME_PRODUCT_OTHER_PACK, SAME_BRAND or OTHER_BRAND; false for DIFFERENT and for NOT_KNOWN; missing when the substitute carries no comparison"}
  line.substitute_formula_outcome: {type: enum,  source: option, label: "the outcome of the formula comparison", values: [SAME_PRODUCT_OTHER_PACK, SAME_BRAND, OTHER_BRAND, DIFFERENT, NOT_KNOWN]}
  line.substitute_formula:        {type: string, source: option, label: "what the formula comparison found", note: "the offer's own sentence with its numbers, read as data like line.name, at most 400 characters"}
  line.substitute_formula_differences: {type: list, source: option, label: "the figures outside the tolerance", note: "each as 'fat 15 g, not 36 g' per 100 g or ml, then 'another fat source' when one ingredient list names a vegetable oil or fat and the other does not"}
  # --- a substitute that is a last resort (rule F-12; tta.policy.last_resort_facts) ---
  line.substitute_last_resort:    {type: bool,   source: option, label: "whether the substitute is a last resort", note: "SubstituteInfo.last_resort: it loses a dietary claim, is flavoured where the product asked for is not, is another product type or cannot be shown to be like for like, and stands in only because nothing like for like can be ordered; false on a line that replaces nothing"}
  line.substitute_last_resort_own_reason: {type: bool, source: engine, label: "whether the last resort has a reason no other rule says", note: "false only when every reason the offer gives is a lost dietary claim, which F-08 says on the same line, or a formula that differs where the formula matters, which F-11 says: one fact, one sentence. True when the offer gives no reason at all, or reasons that cannot be told apart"}
  line.substitute_last_resort_reason: {type: string, source: engine, label: "why the substitute is a last resort", note: "the offer's own reasons (SubstituteInfo.replaceable.reasons), read as data like line.name, at most 400 characters, without the reason F-08 or F-11 says on the same line; else what a last resort is"}

# ---------------------------------------------------------------------------------------------------------
# Rules. `when` is one group, `all` or `any`, of conditions {fact, op, value} and nested groups. Ops:
#   eq, ne, gt, gte, lt, lte, in, not_in, contains_any (with a value) · is_true, is_false, not_empty, is_empty
# `value` is a literal or another fact: {fact: name}.
# `message` is the reason, written as a clause; {placeholders} are facts. The engine turns it into the
#   rule's sentence and joins the clauses of the rules that decide into the decision's sentence.
# `records` lists further facts written to the decision next to those the rule read.
# `authority` is the rule in plain language for GET /v1/authority: the first text whose `when` holds for
#   the profile is used; the last one has no `when`. Only `profile.*` facts may appear in it.
# `approver_role_when` names another role for the rule's question, by the first entry whose `when` holds; else
#   `approver_role` signs. It may read a profile fact also on a fixed rule, because it changes who is asked
#   and never whether a person is asked. For a fixed rule the roles it may name are pinned in code.
# `group` is the plain statement a fixed rule belongs to (`groups` above).
# Words a person reads: a sentence names an allergen in words (line.*_said, profile.*_said), never by its code,
#   and names the buyer by {profile.display_name}, never as "this buyer" or "this profile". The codes are in the
#   facts written next to the sentence (`records`).
# ---------------------------------------------------------------------------------------------------------
rules:
  # --- Fixed rules: no profile can switch these off ---
  - id: F-01
    fixed: true
    group: unconfirmed_goes_to_a_person
    title: A line's quantity is not confirmed
    scope: line
    when:
      all:
        - {fact: line.quantity_confirmed, op: is_false}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "the quantity of {line.quantity} × {line.name} ({line.product_id}) is not confirmed by Valio Aimo"
    records: [line.availability_state]
    authority:
      - text: "A product whose quantity Valio Aimo does not confirm always goes to the purchasing manager."
    justification: "Valio Aimo said on 14 Nov 2026 that a very large availableAmount means the stock is not known (AIMO/FINDINGS.md section 1). The agent never commits a buyer to stock nobody confirmed."

  - id: F-02
    fixed: true
    group: excluded_allergen_never_ordered
    title: A line declares an excluded allergen
    scope: line
    when:
      all:
        - {fact: line.allergen_outcomes, op: contains_any, value: [REJECT]}
    verdict: BLOCK
    message: "{line.name} ({line.product_id}) {line.allergens_declared_said}, which is excluded for {profile.display_name}, so it cannot be ordered"
    records: [line.allergens_declared]
    authority:
      - when: {all: [{fact: profile.excluded_allergens, op: not_empty}]}
        text: "{profile.display_name} excludes {profile.excluded_allergens_said}. A product that contains one of them can never be ordered, even with approval."
      - text: "{profile.display_name} excludes no allergen. When a request excludes one, a product that contains it can never be ordered, even with approval."
    justification: "Defence in depth. The offer already leaves such a product out (ALLERGEN_DECLARED); the policy refuses it even if one gets through. The outcome comes from the allergen rule of SPEC section 6; the policy does not redo it."

  - id: F-03
    fixed: true
    group: unconfirmed_goes_to_a_person
    title: A fact a rule needs is missing
    trigger: missing_fact   # no `when`: fires once for every fact that left a rule unknown, per line
    verdict: APPROVAL
    message: "{missing.what} is missing ({missing.reason}), so {missing.needed_by} cannot be checked"
    authority:
      - text: "When a fact a rule needs is missing, a human decides. Missing data never counts as good data."
    justification: "No data means unknown, not safe: 46.2% of the catalog carries no allergen statement and 3,068 products do not say whether they are sold by variable weight (AIMO/FINDINGS.md sections 3 and 4)."

  - id: F-04
    fixed: true
    group: out_of_date_offer
    title: The option expired or changed before the order
    scope: order
    when:
      all:
        - {fact: context.at_order_time, op: is_true}
        - any:
            - {fact: option.expired, op: is_true}
            - {fact: revalidation.ok, op: is_false}
    verdict: BLOCK
    message: "this option can no longer be ordered as offered: {order.stale_reason}"
    records: [option.valid_until, revalidation.expired, revalidation.changes]
    authority:
      - text: "An option that has expired, whose order cut-off has passed, or whose price or availability changed since the offer cannot be ordered. A fresh offer is needed."
    justification: "The spec says to order by closingTime at the latest to receive goods on availableDate, and a price holds until its validTo. An order rests on the statements of its offer; when they no longer hold the agent asks again."

  # The offer lists an allergen the substitute adds and one it raises from "may contain" to "contains" in
  # one list (SubstituteAllergenCheck.added), so the title names both cases; the message says what the
  # substitute states ("declares oats", "may contain tree nuts") and that the product asked for does not.
  # It stays a BLOCK for every buyer, also one that excludes no allergen (the owner, 14 Nov 2026: "still need
  # to be overly cautious with the allergens"). What a person can do is said: ask for the product by name. A
  # product asked for by name is no substitute, so this rule does not see it, and it goes through the allergen
  # rules like any product (F-02, P-04).
  - id: F-05
    fixed: true
    group: substitute_not_like_for_like
    title: A substitute adds an allergen the original does not declare, or raises one from may contain to contains
    scope: line
    when:
      all:
        - {fact: line.is_substitute, op: is_true}
        - {fact: line.substitute_adds_allergen, op: is_true}
    verdict: BLOCK
    message: "{line.name} ({line.product_id}) would replace {line.substitute_original} and {line.substitute_added_allergens_said}, which the product asked for does not, so it cannot be ordered as a substitute. Ask for it by name if you want it"
    records: [line.substitute_added_allergens]
    authority:
      - text: "A substitute that declares an allergen the product asked for does not can never be ordered as a substitute, for any buyer. A person who wants that product asks for it by name."
    justification: "Of Valio Aimo's 249 listed substitutes, 37 declare an allergen the original does not (AIMO/PLAN.md section 3). A buyer who chose the original chose its allergens: menus and labels depend on them, so the agent never swaps one in, and no approval of a swap lets it through. The product itself is not forbidden: asked for by name it is judged like any product."

  # F-07 is one rule judged in two places, so it is listed twice under one id: once for every line and
  # once for the option as a whole. The two entries must agree on title, verdict and approver role.
  # A request with no needed-by date has no date to meet: its options carry no needed-by check
  # (NOT_ASKED) and the delivery-date claim of their lines is UNKNOWN. Neither sends an order to a human.
  # On an option that does carry a needed-by check, a line whose delivery-date claim is UNKNOWN goes to a
  # human whatever the check says: the policy does not rest on the offer's check alone.
  - id: F-07
    fixed: true
    group: unconfirmed_goes_to_a_person
    title: A line's price is not confirmed, its delivery date is ruled out, or a needed-by date is not verifiably met
    scope: line
    when:
      any:
        - {fact: line.price_claim, op: ne, value: CONFIRMED}
        - {fact: line.delivery_date_claim, op: eq, value: RULED_OUT}
        - all:
            - {fact: option.needed_by_check, op: ne, value: NOT_ASKED}
            - {fact: line.delivery_date_claim, op: eq, value: UNKNOWN}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "for {line.name} ({line.product_id}) {line.unconfirmed_reason}"
    authority:
      - text: "A product whose price Valio Aimo does not confirm, or whose delivery date is ruled out, always goes to the purchasing manager."
    justification: "The order rests on fixed prices: a price that Valio Aimo did not return, or whose validTo has passed, is not one the agent can commit a buyer to. A delivery date is ruled out when the order cut-off has passed or the delivery comes later than asked (SPEC section 4); a person decides whether that still serves the kitchen. When the request gives a needed-by date, a line whose delivery date is not confirmed goes to a person too, also if the option's needed-by check says it is met: the check and the line then contradict each other."

  - id: F-07
    fixed: true
    group: unconfirmed_goes_to_a_person
    title: A line's price is not confirmed, its delivery date is ruled out, or a needed-by date is not verifiably met
    scope: order
    when:
      all:
        - {fact: option.needed_by_check, op: not_in, value: [MET, NOT_ASKED]}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "the needed-by date {option.needed_by} {option.needed_by_finding} for this option"
    authority:
      - text: "When the request gives a needed-by date, an option that does not verifiably meet it always goes to the purchasing manager."
    justification: "A buyer who names a date asked for delivery by that date. The offer checks it for the option as a whole; unless that check says MET, the agent does not decide alone that a later or unconfirmed delivery will do."

  # A nutritional claim is not an allergen statement: lactose-free milk and regular milk both declare milk,
  # so F-05 does not see the difference. A line that replaces nothing never fires this rule.
  - id: F-08
    fixed: true
    group: substitute_not_like_for_like
    title: A substitute lacks a nutritional claim the original carries
    scope: line
    when:
      all:
        - {fact: line.is_substitute, op: is_true}
        - {fact: line.substitute_claims_lost, op: not_empty}
    verdict: APPROVAL
    approver_role: purchasing_manager
    # A lost dietary claim is a nutrition question: it goes to the dietitian where the buyer names one. The
    # offer lists dietary claims only as lost (tta.offers.substitutes.DIETARY_CLAIMS), so every line this rule
    # fires on is such a question. Who is asked changes; that a person is asked does not.
    approver_role_when:
      - when: {all: [{fact: profile.names_dietitian, op: is_true}]}
        role: dietitian
    message: "{line.name} ({line.product_id}) would replace {line.substitute_original} but is not marked {line.substitute_claims_lost_said}, as the product asked for is"
    authority:
      - when: {all: [{fact: profile.names_dietitian, op: is_true}]}
        text: "A substitute that lacks a dietary claim of the product it replaces, for example lactose-free, always goes to the dietitian."
      - text: "A substitute that lacks a dietary claim of the product it replaces, for example lactose-free, always goes to the purchasing manager: {profile.display_name} names no dietitian."
    justification: "A buyer who names a lactose-free milk asked for lactose-free. Regular milk declares the same allergen, milk, so the allergen rule for substitutes passes it and a profile that accepts substitutes of the same category would let the agent order it alone. What the buyer gives up is the claim; a person decides whether that is acceptable."

  # Recipe logic (task MENU-1): when a recipe's ingredient cannot be had in time, the menu planner may order
  # another product type that does the same job in the dish and sets stands_in_for on that request line.
  # That is a judgement about a dish, not a product swap the buyer asked for, so a person always makes it.
  - id: F-09
    fixed: true
    group: substitute_not_like_for_like
    title: A line stands in for a recipe's own ingredient
    scope: line
    when:
      all:
        - {fact: line.stands_in_for, op: ne, value: ""}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "{line.name} ({line.product_id}) stands in for an ingredient of a recipe: {line.stands_in_for}, so a person checks that the dish still works"
    authority:
      - text: "A product type that recipe logic chose in place of a recipe's own ingredient always goes to the purchasing manager, who checks that the dish still works."
    justification: "Valio Aimo's scenarios ask for substitutions through recipe logic rather than a simple SKU swap. Whether a natural yoghurt can carry a quark dessert, or a vegetable-fat cream a sauce, changes the dish a kitchen serves; the recipes and their alternatives are ours and illustrative, so the agent never decides that alone."

  # The formula (Valio Aimo, 14 Nov 2026: "for cakes/things that require the formula the ingredient and
  # chemestry can make a difference"). The offer measures every substitute against the product it replaces
  # (tta.offers.formula) and ranks the ones that keep the formula first; this rule is what happens when the
  # one offered does not. It is FIXED: where the formula matters, no profile setting lets such a substitute
  # through. "Where the formula matters" is the fact line.formula_matters: the request line says so, or the
  # buyer profile says so for all its lines (formula_matters: true, the bakery). A profile can therefore ADD
  # lines the rule looks at and can never remove one, which is why the rule may be fixed although a profile
  # setting widens it: the `when` below reads no profile.* fact, and a request's own word always holds.
  # A substitute with no comparison at all leaves the fact missing, so F-03 sends it to a person.
  - id: F-11
    fixed: true
    group: substitute_not_like_for_like
    title: A substitute does not keep the formula where the formula matters
    scope: line
    when:
      all:
        - {fact: line.is_substitute, op: is_true}
        - {fact: line.formula_matters, op: is_true}
        - {fact: line.substitute_keeps_formula, op: is_false}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "{line.name} ({line.product_id}) would replace {line.substitute_original} where the formula matters ({line.formula_matters_reason}), and the data does not show the same formula: {line.substitute_formula}"
    records: [line.substitute_formula_outcome, line.substitute_formula_differences]
    authority:
      - when: {all: [{fact: profile.formula_matters, op: is_true}]}
        text: "{profile.display_name} uses its products as ingredients, so the formula matters on every line: a substitute whose formula differs from the original's, or cannot be compared, always goes to the purchasing manager."
      - text: "Where a request line says the formula matters, a substitute whose formula differs from the original's, or cannot be compared, always goes to the purchasing manager."
    justification: "A cream with 15% fat does not whip and a vegetable-fat blend does not behave as butter in a dough: the swap changes what the kitchen can make. Of Valio Aimo's 249 listed substitute pairs our measure finds 100 that keep the formula, 67 that differ and 82 that cannot be compared (whole catalog, AIMO/build/replan/P10-formula.md). The tolerances are ours and illustrative; 'cannot be compared' is never read as 'the same'."

  # A last resort (found by L2a-R, 14 Nov 2026). The offer marks a substitute `last_resort` when it loses a
  # dietary claim, is flavoured where the product asked for is not, or is another product type: it is shown
  # only because no like-for-like product can be ordered. F-08 already sends the claim-loser to a person. A
  # flavoured or other-type one fired no rule of its own, so a buyer who lets the agent order alone and accepts
  # same-category substitutes would have had a nutty-vanilla drink ordered alone for a plain oat drink. It is
  # FIXED: no profile setting lets a last resort through.
  # One fact, one sentence: a lost dietary claim is F-08's to say and a formula that differs where the formula
  # matters is F-11's. On a line where one of them fires, this rule leaves that reason out, and when no reason
  # of its own is left it does not fire (line.substitute_last_resort_own_reason). The line goes to a person
  # either way. Reasons the offer does not give one by one are all kept.
  - id: F-12
    fixed: true
    group: substitute_not_like_for_like
    title: A substitute is a last resort
    scope: line
    when:
      all:
        - {fact: line.is_substitute, op: is_true}
        - {fact: line.substitute_last_resort, op: is_true}
        - {fact: line.substitute_last_resort_own_reason, op: is_true}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "{line.name} ({line.product_id}) would replace {line.substitute_original} as a last resort: {line.substitute_last_resort_reason}. A person decides whether it will do"
    authority:
      - text: "A substitute that is a last resort (it is flavoured where the product asked for is not, is another product type, or cannot be shown to be like for like) always goes to the purchasing manager."
    justification: "A kitchen that asked for a plain oat drink for coffee cannot use a nutty-vanilla one without knowing; the offer shows a last resort only because nothing like for like can be ordered, and a person decides whether it will do. The reading of flavour and product type from product names is ours and illustrative (3,465 of 17,546 catalog products read as flavoured)."

  # --- Profile rules: the settings of one buyer ---
  # F-10, "Every order needs human approval", is the rule the profile setting `auto_order_enabled` drives.
  # It is NOT an entry of this list: it is written in code (tta.policy.human_approval) and applied twice, when
  # an option is judged (tta.policy.engine) and when an order is placed (tta.orders.checking).
  #   * auto_order_enabled: false (every shipped profile; Valio Aimo, 14 Nov 2026: "the final submition should
  #     always have the input from the user"): an order that no rule of this file sends to a person goes to
  #     the purchasing manager under F-10. When another rule already names a role, that role signs and F-10
  #     is not added. What a person reads: "Prepared: confirm to order" (the agent prepares the order, a person
  #     confirms it), then "Confirmed by <name>" (tta.orders.wording).
  #   * auto_order_enabled: true (the buyer's own choice; Valio Aimo: "after and if you are 100% sure yes"):
  #     the agent orders alone only when no rule of this file fires and every statement of every line is
  #     confirmed (price, quantity, delivery date, allergens, origin). One statement that is unknown or
  #     missing, and F-10 still sends the order to the purchasing manager and names it.
  # It is not marked fixed, because a profile setting switches it. It replaces the rule P-00 of earlier
  # versions of this file, which fired next to every other rule. F-11, the formula rule, is a fixed rule above.

  - id: P-01
    fixed: false
    title: The order is above the spend limit per order
    scope: order
    when:
      all:
        - {fact: option.net_eur, op: gt, value: {fact: profile.max_order_net_eur}}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "the total of €{option.net_eur} before tax is above the €{profile.max_order_net_eur} limit per order of {profile.display_name}"
    authority:
      - text: "An order above €{profile.max_order_net_eur} before tax goes to the purchasing manager."
    justification: "Standard spend control; the brief names it as a guardrail."

  - id: P-02
    fixed: false
    title: The day's spend would pass the limit per day
    scope: order
    when:
      all:
        - {fact: order.day_net_eur, op: gt, value: {fact: profile.max_daily_net_eur}}
    verdict: APPROVAL
    approver_role: finance
    message: "with this order today's spend would reach {order.day_net_said}, above the €{profile.max_daily_net_eur} limit per day of {profile.display_name}"
    records: [context.day_committed_net_eur, context.day_waiting_net_eur, option.net_eur]
    authority:
      - text: "When the day's orders, this one included, pass €{profile.max_daily_net_eur} before tax, the order goes to finance."
    justification: "Stops one large order from being split into many small ones under the limit per order."

  - id: P-03
    fixed: false
    title: The option covers too little of the requested quantity
    scope: order
    when:
      all:
        - {fact: option.fill_ratio, op: lt, value: {fact: profile.min_fill_ratio}}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "only {option.fill_ratio} of {option.least_covered} is covered, below the {profile.min_fill_ratio} minimum (covered: {option.coverage_by_line})"
    authority:
      - text: "An option that covers less than {profile.min_fill_ratio} of the requested quantity goes to the purchasing manager."
    justification: "A partial fill changes what the kitchen can serve; below the buyer's threshold a person decides."

  - id: P-04
    fixed: false
    title: A line does not rule out an excluded allergen
    scope: line
    when:
      all:
        - {fact: line.allergen_outcomes, op: contains_any, value: [TO_HUMAN]}
    verdict: APPROVAL
    approver_role: dietitian
    message: "{line.name} ({line.product_id}) {line.allergens_to_human_said}, which is excluded for {profile.display_name}: Valio Aimo's data does not rule it out"
    records: [line.allergens_to_human]
    authority:
      - when: {all: [{fact: profile.excluded_allergens, op: is_empty}]}
        text: "{profile.display_name} excludes no allergen. When a request excludes one, a product that does not rule it out goes to the dietitian."
      - when: {all: [{fact: profile.declared_only_allergens, op: is_empty}]}
        text: "{profile.display_name} excludes {profile.excluded_allergens_said}, and each must be confirmed absent: a product that may contain one, leaves it undeclared or says nothing about it goes to the dietitian."
      - when: {all: [{fact: profile.strict_allergens, op: is_empty}]}
        text: "{profile.display_name} keeps {profile.excluded_allergens_said} out as an ingredient: a product that may contain one goes to the dietitian; one that says nothing about it passes and is shown as unverified."
      - text: "{profile.display_name} excludes {profile.strict_allergens_said}, and each must be confirmed absent: a product that may contain one, leaves it undeclared or says nothing about it goes to the dietitian. It keeps {profile.declared_only_allergens_said} out as an ingredient: a product that may contain one goes to the dietitian; one that says nothing about it passes and is shown as unverified."
    justification: "MAY_CONTAIN appears on 2,685 products and 46.2% of the catalog has no allergen statement (AIMO/FINDINGS.md section 3). A named person owns the decision to accept that."

  - id: P-05
    fixed: false
    title: A substitute is outside what the profile accepts
    scope: line
    when:
      all:
        - {fact: line.is_substitute, op: is_true}
        - {fact: line.substitute_scope, op: not_in, value: {fact: profile.substitution_scopes_allowed}}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "{line.name} ({line.product_id}) replaces {line.substitute_original}, a substitute that {profile.display_name} does not accept without a human"
    records: [profile.substitution_without_approval]
    authority:
      - when: {all: [{fact: profile.substitution_without_approval, op: eq, value: NONE}]}
        text: "Every substitute goes to the purchasing manager."
      - when: {all: [{fact: profile.substitution_without_approval, op: eq, value: LISTED_BY_SUPPLIER}]}
        text: "A substitute that Valio Aimo does not list for the product goes to the purchasing manager."
      - text: "A substitute that Valio Aimo does not list for the product and that is not in the same product category goes to the purchasing manager."
    justification: "The brief asks that substitutions outside stated preferences get a sign-off."

  - id: P-06
    fixed: false
    title: A line is sold by variable weight
    scope: line
    when:
      all:
        - {fact: line.variable_weight, op: is_true}
        - any:
            - {fact: profile.variable_weight, op: eq, value: APPROVAL}
            - {fact: option.total_is_ceiling, op: is_false}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "{line.name} ({line.product_id}) is sold by variable weight, so the total is an estimate: Valio Aimo invoices the weight delivered, which can be lower or higher than the weight ordered"
    authority:
      - when: {all: [{fact: profile.variable_weight, op: eq, value: APPROVAL}]}
        text: "A product sold by variable weight goes to the purchasing manager: its total is an estimate, because Valio Aimo invoices the weight delivered, which can be lower or higher than the weight ordered."
      - text: "A product sold by variable weight needs no approval of its own when the offer marks its total as an estimate: Valio Aimo invoices the weight delivered, which can be lower or higher than the weight ordered."
    justification: "632 products are sold by variable weight (AIMO/FINDINGS.md section 4). Valio Aimo, 14 Nov 2026, on whether such a product is invoiced for the weight ordered or delivered: 'what is actually delivered. like in a normal store'. So the price per kilo is fixed and the total is not: it is an estimate, and no bound on the difference is in the data. A buyer chooses whether that estimate needs a named person."

  - id: P-07
    fixed: false
    title: A line carries a deposit the total leaves out
    scope: line
    when:
      all:
        - {fact: line.has_deposits, op: is_true}
        - any:
            - {fact: profile.deposits, op: eq, value: APPROVAL}
            - {fact: option.total_excludes_deposits, op: is_false}
    verdict: APPROVAL
    approver_role: finance
    message: "{line.name} ({line.product_id}) carries a deposit that has no published price, so the total of €{option.net_eur} leaves it out"
    authority:
      - when: {all: [{fact: profile.deposits, op: eq, value: APPROVAL}]}
        text: "A product that carries a deposit goes to finance: deposits have no published price, so the total leaves them out."
      - text: "A product that carries a deposit may be ordered alone; the total leaves deposits out and says so."
    justification: "506 products carry deposits and none of the 7 deposit codes can be priced (AIMO/FINDINGS.md section 4)."

  # A request that renews no standing order has no history: standing.is_renewal is false and the rule is false,
  # whatever else is known. A history too short to judge leaves standing.history_judged false: no human is asked,
  # and the renewal says so. The 6 and the 3 of the texts are DRIFT_WINDOW and MIN_RENEWALS_TO_JUDGE of
  # tta.policy.drift (a test checks that they agree).
  - id: P-08
    fixed: false
    title: A standing order's renewal drifts from its history
    scope: order
    when:
      all:
        - {fact: standing.is_renewal, op: is_true}
        - {fact: standing.history_judged, op: is_true}
        - {fact: standing.largest_drift, op: gt, value: {fact: profile.standing_order_drift_ratio}}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "{standing.drift_found}, more than the {profile.standing_order_drift_ratio} tolerance of {profile.display_name}"
    records: [standing.standing_order_id, standing.renewals_compared, standing.largest_drift]
    authority:
      - when: {all: [{fact: profile.standing_order_drift_ratio, op: gte, value: 0}]}
        text: "A renewal of a standing order whose quantity or unit price on a line differs by more than {profile.standing_order_drift_ratio} from the median of that line's last 6 renewals goes to the purchasing manager. With fewer than 3 past renewals the history is too short to judge, and the renewal says so."
      - text: "{profile.display_name} sets no drift tolerance for standing orders: a renewal with enough history goes to the purchasing manager, because the tolerance is missing (F-03)."
    justification: "Valio Aimo's example scenario: 'the agent learns a kitchen's recurring weekly order and flags anomalies (portion counts creeping up, cost drifting) before auto-renewing it.' Every renewal of AIMO/USE-CASES.md section 6, 100 to 290 L of 469363, was AUTO with no rule fired. The Valio Aimo mock has no order history: the demonstration's history is synthetic and says so."

  # A preference (most reliable, lowest carbon, earliest) has a price. The offer states it on the option ranked
  # by the preference, as an amount and as a share of the cheapest confirmed option, and ranks the cheapest
  # option first when the share is above 25% (tta.offers.preference.MAX_PREFERENCE_PREMIUM, our threshold).
  # This rule is the buyer's own, lower or equal, limit: above it the preferred option goes to a person. A
  # profile cannot set more than 25% (tta.contracts.policy.MAX_PREFERENCE_PREMIUM_RATIO; a test checks that the
  # two values agree), so an option the agent may take alone for its preference is always one the offer ranks
  # first. A profile that sets no limit leaves profile.limits_preference_premium false: the rule is false.
  - id: P-09
    fixed: false
    title: A preference costs more than the profile accepts
    scope: order
    when:
      all:
        - {fact: profile.limits_preference_premium, op: is_true}
        - {fact: option.preference_premium_ratio, op: gt, value: {fact: profile.max_preference_premium_ratio}}
    verdict: APPROVAL
    approver_role: purchasing_manager
    message: "this option is ranked by the preference of {profile.display_name} and costs €{option.net_above_cheapest} more before tax than the cheapest confirmed option, a premium of {option.preference_premium_ratio}, above the {profile.max_preference_premium_ratio} a preference may add without a human"
    authority:
      - when: {all: [{fact: profile.limits_preference_premium, op: is_true}]}
        text: "An option ranked by a preference (most reliable, lowest carbon, earliest) that costs more than {profile.max_preference_premium_ratio} above the cheapest confirmed option goes to the purchasing manager."
      - text: "{profile.display_name} sets no limit on what a preference may cost. The offer still ranks the cheapest confirmed option first when a preference costs more than 25% above it (our threshold)."
    justification: "A preference must not buy the tenderloin for a stew: 'most reliable' or 'lowest carbon' says what to favour, not that any price is accepted. The share is the buyer's to set; nothing here is a Valio Aimo limit."

# Fixed rules that are enforced where the caller's identity is known, not by the engine. They are listed
# here so that this file states every fixed rule and the policy hash covers them.
access_rules:
  - id: F-06
    title: An agent cannot approve an order
    group: agent_never_approves
    enforced_by: "the approval routes (tta.orders and tta.api)"
    outcome: "refused with the problem type not-authorised"
    text: "An agent can never approve an order, its own included: approval routes refuse agent tokens."
    justification: "An approval is a human's signature. An agent that could give it would have no limit at all."

# The sentence of a decision, by verdict. {reasons} is the clauses of the rules that decide, each followed
# by its rule id; {roles} is who must sign. A sentence names the buyer by {profile.display_name}, never by the
# profile id. The sentence of an order that only F-10 holds back is in tta.policy.human_approval.
decision_sentences:
  AUTO: "The agent may place this order alone: the total of €{option.net_eur} before tax is within the €{profile.max_order_net_eur} limit per order, today's spend would be €{order.day_net_eur} of the €{profile.max_daily_net_eur} limit per day of {profile.display_name}, {option.fill_ratio} of the requested quantity is covered, and no rule asks for a human."
  APPROVAL: "The agent cannot place this order alone: {reasons}. It needs {roles}."
  BLOCK: "This order cannot be placed, even with approval: {reasons}."

# GET /v1/authority. `summary`: every text whose `when` holds for the profile, in this order, followed by
# the text of each access rule. Only `profile.*` facts may appear.
authority:
  note: "The limit values of this profile are illustrative: they are ours, chosen for the demonstration. The Valio Aimo mock has no customer limits."
  summary:
    - when: {all: [{fact: profile.auto_order_enabled, op: is_false}]}
      text: "The agent prepares the order, a person confirms it (F-10). The purchasing manager confirms when no other approval role is required."
    - when: {all: [{fact: profile.auto_order_enabled, op: is_true}]}
      text: "{profile.display_name} lets the agent place an order alone, and only when no rule asks for a human and every statement of the offer is confirmed: price, quantity, delivery date, allergens and origin (F-10)."
    - when: {all: [{fact: profile.auto_order_enabled, op: is_false}]}
      text: "Additional review depends on the order and daily spend limits (€{profile.max_order_net_eur} and €{profile.max_daily_net_eur} before tax) and the minimum quantity coverage of {profile.min_fill_ratio}."
    - when: {all: [{fact: profile.auto_order_enabled, op: is_true}]}
      text: "Alone, at most: €{profile.max_order_net_eur} before tax per order and €{profile.max_daily_net_eur} before tax per day, this order included, with at least {profile.min_fill_ratio} of the requested quantity covered."
    - text: "Always to a human: a product whose quantity is not confirmed, whose price is not confirmed or whose delivery date is ruled out; an option that does not verifiably meet the needed-by date of the request; a substitute that lacks a dietary claim of the product it replaces; a substitute that does not keep the formula where the formula matters; a substitute that is a last resort; and any fact a rule needs that is missing."
    - text: "Never, even with approval: a product that contains an excluded allergen, a substitute that declares an allergen the product asked for does not, and an option that expired or changed before the order."
