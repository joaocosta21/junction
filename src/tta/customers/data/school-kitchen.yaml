# Customer "school-kitchen". SYNTHETIC: every name, number and past order below is made up for the demonstration.
# The Valio Aimo mock has no customer model; Valio's mentors told us to generate customer data (BRIEF section 2, V1).
# The people's names are the shop page's (src/tta/ui/static/shop/js/kitchens.js). Every product id is real and has
# confirmed stock in tonight's recording.
#
# Limits, the allergen rule, the substitution scope and who may approve are the buyer profile's
# (src/tta/policy/profiles/school-kitchen.yaml, written by another lane), never this file's. The runbook keeps tree
# nuts, peanuts and sesame out for the whole school under the strict rule: the milk 462775 and the yoghurt 464517
# state nothing about them, so that rule sends them to a person (pinned in tests/customers/test_against_catalog.py).
#
# What the history is written to show (P1 section 4.2, P15 section 4.6): steady weekly orders on Mondays; 120 L of
# milk a week against 51 confirmed in the recording, by design (partial availability); oat drink rising from 60 to
# 90 L while the standing order still stores 60 L (the trend: a median of 84 L against 70 L, +20%).

