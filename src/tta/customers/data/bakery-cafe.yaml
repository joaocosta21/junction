# Customer "bakery-cafe". SYNTHETIC: every name, number and past order below is made up for the demonstration.
# The Valio Aimo mock has no customer model; Valio's mentors told us to generate customer data (BRIEF section 2, V1).
# The people's names are the shop page's (src/tta/ui/static/shop/js/kitchens.js). Every product id is real and has
# confirmed stock in tonight's recording.
#
# Limits, the allergen rule, the substitution scope and who may approve are the buyer profile's
# (src/tta/policy/profiles/bakery-cafe.yaml, written by another lane), never this file's.
#
# The runbook's choice: the bakery's dairy is the Arla products that have confirmed stock in the recording (P1
# section 4.2), and the formula matters (Valio, V10): the creams are INGREDIENT. Coffee milk is its own product type
