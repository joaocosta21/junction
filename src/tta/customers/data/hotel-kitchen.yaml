# Customer "hotel-kitchen". SYNTHETIC: every name, number and past order below is made up for the demonstration.
# The Valio Aimo mock has no customer model; Valio's mentors told us to generate customer data (BRIEF section 2, V1).
# The people's names are the shop page's (src/tta/ui/static/shop/js/kitchens.js). Every product id is real and has
# confirmed stock in tonight's recording (tests/customers/test_against_catalog.py).
#
# Limits, the allergen rule, the substitution scope and who may approve are the buyer profile's
# (src/tta/policy/profiles/hotel-kitchen.yaml), never this file's.
#
# What the history is written to show (P15 section 4.6): a weekly milk order on Mondays whose median is 100 L
# (the standing order of src/tta/standing/demo.py); cooking cream in 7 of the 8 weeks, so asking for the milk is
# reminded of the cream; greek yoghurt in 3 of 8 and beef in 4 of 8, which stay silent.

customer_id: hotel-kitchen
synthetic: true
name: Harbourside Hotel
kind: Hotel kitchen
detail: "Helsinki · breakfast and à la carte"
customer_number: "610 245"
address: "Satamakatu 4, 00160 Helsinki"
delivery_days: "Mon–Sat"
contact: {name: Hanna Laine, title: Purchasing manager}
people:   # one person confirms: the person who orders holds every role a rule can ask for, so her one confirmation
          # is the whole confirmation, whatever rule asked (as the bakery's owner, decision B27). The hotel kitchen
          # names no dietitian and no separate finance signer; the profile names the same three roles.
  purchasing_manager: Hanna Laine
  finance: Hanna Laine
  dietitian: Hanna Laine
