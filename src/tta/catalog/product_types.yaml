    Categories 10590 (shell eggs, 9) and 10592 (liquid and cooked egg products, 21) hold 30
    products; "egg" starts a word in 28 of their English names. The plain product is the egg a
    recipe means: hen's eggs in the shell and liquid whole egg. The variety terms (review finding
    C3-F3, 15 Nov 2026: a menu ordered an egg glaze spray as eggs) set apart the parts of an egg (3
    yolks, 3 whites and an albumen powder), what is already cooked (4 boiled and peeled, 2 scrambled
    mixes, a cooked egg white), 2 egg and butter spreads, the glaze spray (468206), a mayonnaise
    base (468127) and quail eggs (463692, "viiriäisen munia"). 13 are plain: 8 of hen's eggs in the
    shell and 5 of liquid whole egg.

