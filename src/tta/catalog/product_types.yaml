# Product types: what a buyer can ask for by a key instead of by words (SPEC section 3, step 2).
#
# This table is ours, not Valio's. The product file has 349 five-digit category codes and no category
# names, so each entry was derived by reading the English product names inside the categories. Every
# figure is a count over the whole catalog (17,546 products) made on 14 Nov 2026; a test recounts
# `products` on every run. The table covers the demo scenarios and the commonest food-service types;
# it is not a complete taxonomy.
#
# A product is of a type when all of these hold:
#   categories     its category is one of these codes
#   name_terms     (when given) a word of its English name starts with one of these terms,
#                  or its Finnish name contains one
#   exclude_terms  (when given) no word of its English name starts with one of these terms,
#                  and its Finnish name contains none
#   variety_terms  (when given) no word of its English name starts with one of these terms, and its
#                  Finnish name contains none: such a product is a variety of the type (rye flour,
#                  icing sugar, egg yolk), not its plain product
#   claims         (when given) it carries every one of these nutritionalClaim codes
# `products` is how many products that selects and `derived_from` says how the entry was derived.
# `note` (optional) is a sentence for the buyer whenever a request asks for the type: what the type
# leaves out and how to ask for it. The offer carries it as a note.
# An exclude term and a variety term differ in what a request finds (review finding C3-F3, 15 Nov 2026: a
# menu ordered an egg glaze spray as eggs and rye flour as flour). A product with an exclude term is another
# product, and a request that says the term does not name the type at all ("sour milk" is not milk). A
# variety is still found through the type when the request names it: "rye flour" is read as the type flour
# with the name term "rye" and finds the rye flours, while "flour" alone, in a request or in a recipe, finds
# plain wheat flour only. `products` counts the plain products.
# `raw` (optional, ours) marks raw meat and fish sold as it is: a cut has no recipe of its own, so the agent
# does not learn "a substitute must keep its recipe" for it from how a customer uses it.
#
# A type names one kind of product. A kind a buyer would send back is not in it: it has a type of its
# own (milk for coffee is `coffee_milk`, not `milk`).
#
# A claim is never an allergen statement: a request for lactose-free milk is type `milk` plus the
# claim FREE_FROM_LACTOSE, and all 26 such products still declare milk as an allergen.

milk:
  categories: ["10400"]
  exclude_terms: ["sour", "piimä", "coffee drink", "maitokahvi", "soygurt", "coffee milk", "kahvimaito", "cafè milk"]
  products: 74
  note: >-
    Coffee milk was left out: a request for milk gets no milk for coffee and no flavoured coffee milk.
    Ask for coffee milk by name (product type coffee_milk) to get it.
  derived_from: >-
    Category 10400 holds 91 products. The exclude terms leave out the 17 that are not plain milk: 11
    sour milks ("sour" in the English name, "piimä" in the Finnish one), a coffee drink (469266,
    "maitokahvijuoma"), a soy yoghurt (472516) and the 4 milks for coffee, which are type coffee_milk
    (462626, 464237 and 473142 say "coffee milk" and "kahvimaito"; 463380 says "Cafè milk"). Valio
    Aimo was asked on 14 Nov 2026 whether a buyer who asks for milk accepts milk for coffee and
    answered "no be explicit". The 74 that stay are milk and lactose-free milk drinks of every fat
    level. With the claim FREE_FROM_LACTOSE the type gives 26 products; the category has 35 with that
    claim, 4 of them sour milks, 4 milks for coffee and 1 the coffee drink.

coffee_milk:
  categories: ["10400"]
  name_terms: ["coffee milk", "kahvimaito", "cafè milk"]
  products: 4
  derived_from: >-
    The 4 milks for coffee of category 10400 (91 products), left out of type milk: Valio coffee milk
    5 dl (462626) and 1 l (464237), Valio coffee milk drink vanilla (473142, the one flavoured milk
    of the category) and Arla Cafè milk (463380). Each says "coffee milk" in its English name or
    "kahvimaito" in its Finnish one, or "Cafè milk". All 4 carry the claim FREE_FROM_LACTOSE. The
    term is "cafè milk" and not "cafè", so that a sentence about a café does not name the type. The
    coffee drink 469266 ("maitokahvijuoma") is a ready drink and is in neither type.

sour_milk:
  categories: ["10400"]
  name_terms: ["sour", "piimä"]
  products: 11
  derived_from: >-
    The 11 products of category 10400 (91 products) with a word starting with "sour" in the English
    name or "piimä", the Finnish word for sour milk, in the Finnish name. No product outside the
    category has "piimä" in its name. 4 of the 11 carry the claim FREE_FROM_LACTOSE.

cream:
  categories: ["10401"]
  exclude_terms: ["vegetable", "kasvirasva", "alternative", "rama professional", "quark", "mousse"]
  variety_terms: ["flavoured", "sweet chili", "spray", "whipped", "kermavaahto"]
  products: 32
  derived_from: >-
    Category 10401 holds 53 products; "cream" starts a word in 46 of their English names
    (cooking and whipping cream). The exclude terms leave out the 9 vegetable-fat blends, which are
    type vegetable_cream: 4 say "vegetable" in the English name and "kasvirasva" (vegetable fat) in
    the Finnish one (462703, 463254, 463299, 463975), 2 say "cooking cream alternative" (469160,
    469162), and 3 are Rama Professional (467142, 467173, 467297), whose Finnish ingredient lists
    name vegetable oils or fats (their English lists read "-"). "quark" and "mousse" leave out the
    2 products of the category that are not cream: a layered quark (473205) and a protein mousse
    (473461). 42 are cream. The variety terms (review finding C3-F3, 15 Nov 2026) set apart the 10
    of them a cook would not accept for "cream" in a recipe: the 6 cooking creams named "flavoured"
    (smoked cheese, three cheeses, three onions, pepper cheese, lemon and pepper, red pesto), the
    sweet chili one (468521), and the 3 whipped creams in a spray can (462652, 473847, 474206;
    "kermavaahto" is whipped cream). 32 are plain cream.

vegetable_cream:
  categories: ["10401"]
  name_terms: ["vegetable", "kasvirasva", "alternative", "rama professional"]
  products: 9
  derived_from: >-
    The 9 vegetable-fat blends of category 10401 (53 products), left out of type cream: cooking and
    whipping blends of milk, buttermilk or cream with vegetable fat or oil. The ingredient list of
    each names rapeseed, sunflower, palm or coconut oil, or vegetable fats and oils. 4 say
    "vegetable" (English) and "kasvirasva" (Finnish) in the name, 2 "alternative" and 3 are Rama
    Professional.

